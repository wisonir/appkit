<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppKit | Engineered for Scale & High-Performance Web Apps</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M16 6L6 11l10 5 10-5-10-5z' fill='%2367e8f9'/><path d='M6 16l10 5 10-5' stroke='%23818cf8' stroke-width='2' fill='none'/><path d='M6 21l10 5 10-5' stroke='%234f46e5' stroke-width='2' fill='none'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            darkTheme: '#050814',
            surfaceCard: '#0b1120',
            appIndigo: '#4f46e5',
            appViolet: '#6366f1',
            appCyan: '#38bdf8',
          },
          animation: {
            'float-subtle': 'float 3.5s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.6' },
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050814;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .appkit-glow-bg {
      background: 
        radial-gradient(circle at 50% 25%, rgba(79, 70, 229, 0.28) 0%, rgba(11, 17, 32, 0.92) 55%, #050814 100%),
        #050814;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    .progress-bar-fill {
      transition: width 0.35s ease;
      background: linear-gradient(90deg, #4f46e5 0%, #6366f1 50%, #67e8f9 100%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    #appFrame {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
      background-color: #050814;
    }
  </style>
</head>
<body class="appkit-glow-bg antialiased selection:bg-appIndigo selection:text-white">

  <!-- ========================================================
       SPLASH SCREEN (SINKRONISASI APPKIT TEMA DARK/INDIGO)
  ======================================================== -->
  <div id="splash" class="appkit-glow-bg px-4 sm:px-6">
    
    <div class="max-w-2xl w-full flex flex-col items-center text-center animate-float-subtle">
      
      <!-- Logo AppKit (Layers Cyan-Indigo + Teks AppKit) -->
      <div class="flex items-center gap-3 mb-6 bg-slate-900/80 backdrop-blur-xl px-5 py-2.5 rounded-2xl border border-slate-700/70 shadow-[0_12px_36px_rgba(0,0,0,0.5)]">
        <div class="w-10 h-10 rounded-xl bg-slate-950 flex items-center justify-center border border-indigo-500/30 shadow-md shadow-indigo-500/20">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#38bdf8"/>
            <path d="M2 12l10 5 10-5" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
            <path d="M2 17l10 5 10-5" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="text-white font-extrabold text-xl tracking-tight">AppKit</span>
      </div>

      <!-- Pill Status Header -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-semibold mb-5 tracking-wide backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-soft"></span>
        <span>Open for Custom Web Apps &amp; Automation</span>
      </div>

      <!-- Headline Utama AppKit -->
      <h1 class="text-3xl sm:text-4xl md:text-[2.65rem] font-extrabold text-white tracking-tight leading-[1.22] mb-4">
        Engineered for Scale &amp; High-Performance <br class="hidden sm:inline">
        <span class="bg-gradient-to-r from-indigo-400 via-violet-300 to-sky-300 bg-clip-text text-transparent">
          Business Web Apps
        </span>
      </h1>

      <!-- Deskripsi Ekosistem -->
      <p class="text-slate-400 text-xs sm:text-sm font-normal max-w-xl leading-relaxed mb-8">
        Koleksi solusi web app siap pakai, sistem manajemen multi-cabang, dan otomasi Google Ecosystem dengan performa tinggi dan biaya operasional hemat.
      </p>

      <!-- Loading Section -->
      <div class="w-full max-w-xs flex flex-col items-center gap-3">
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700/80 shadow-inner">
          <div id="loadingProgress" class="progress-bar-fill h-full w-1/4 rounded-full"></div>
        </div>

        <div class="flex items-center gap-2.5 mt-1">
          <div class="w-4 h-4 border-2 border-indigo-400/30 border-t-indigo-400 rounded-full animate-spin"></div>
          <span id="loadingText" class="text-xs font-semibold text-indigo-300 tracking-wider uppercase">
            Menginisialisasi Ekosistem...
          </span>
        </div>
      </div>

    </div>

  </div>

  <!-- Target Web App Iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzN6W3aL9c80J7FpbhvyrgIdXUtbhpndwibVn_iyla2NbILai_-dDJrxC-WE-9U8xjc/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen
    onload="handleFrameReady()">
  </iframe>

  <!-- Skrip Pengontrol Loading & Transisi -->
  <script>
    let isLoaded = false;
    const splash = document.getElementById("splash");
    const appFrame = document.getElementById("appFrame");
    const progressBar = document.getElementById("loadingProgress");
    const loadingText = document.getElementById("loadingText");

    let progress = 25;
    const progressInterval = setInterval(() => {
      if (progress < 85) {
        progress += Math.floor(Math.random() * 12) + 5;
        if (progress > 85) progress = 85;
        progressBar.style.width = progress + "%";

        if (progress > 45 && progress < 70) {
          loadingText.innerText = "Memuat Modul Web App...";
        } else if (progress >= 70) {
          loadingText.innerText = "Menyiapkan Layanan Cloud...";
        }
      }
    }, 420);

    function handleFrameReady() {
      if (isLoaded) return;
      isLoaded = true;
      clearInterval(progressInterval);

      progressBar.style.width = "100%";
      loadingText.innerText = "Aplikasi Siap Digunakan!";

      setTimeout(() => {
        splash.style.opacity = "0";
        splash.style.visibility = "hidden";
        appFrame.style.display = "block";
      }, 500);
    }

    // Safety fallback 8 detik
    setTimeout(() => {
      if (!isLoaded) {
        handleFrameReady();
      }
    }, 8000);
  </script>

</body>
</html>
